spring:
  profiles:
    default: default
  application:
    name: ms-auth-server
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: ${PORT:8890}
  address: 0.0.0.0
  servlet:
    context-path: /ms-auth-server


app:
  jwt:
    secret: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
    expiration-minutes: 60
    issuer: ms-auth-server

eureka:
  instance:
    # Dominio privado que Railway asigna a este servicio
    hostname: ${RAILWAY_PRIVATE_DOMAIN:localhost}

    # No registrar el hostname aleatorio ni una IP temporal
    prefer-ip-address: false

    # Puerto interno real de ms-auth-server
    non-secure-port: ${PORT:8890}
    non-secure-port-enabled: true
    secure-port-enabled: false
    instance-id: ${spring.application.name}:${RAILWAY_REPLICA_ID:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
